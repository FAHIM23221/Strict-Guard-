name: Build Strict Guard APK

on:
  push:
    paths:
      - "source.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare build environment
        run: |
          mkdir -p "$HOME/workspace"
          mkdir -p "$HOME/workspace/.sdk-tmp"

          ln -s "$JAVA_HOME" "$HOME/workspace/jdk17"
          ln -s "$ANDROID_HOME" "$HOME/workspace/.android-sdk"

          cd "$HOME/workspace"
          curl -fL \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip \
            -o kotlin.zip

          mkdir -p kotlinc-1.9.22
          unzip -q kotlin.zip -d kotlinc-1.9.22

          curl -fL \
            https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar \
            -o .sdk-tmp/junit-4.13.2.jar

          curl -fL \
            https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar \
            -o .sdk-tmp/hamcrest-core-1.3.jar

      - name: Extract source ZIP
        run: |
          test -f source.zip
          mkdir -p "$RUNNER_TEMP/strict-guard-source"
          unzip -q source.zip -d "$RUNNER_TEMP/strict-guard-source"

          BUILD_SCRIPT=$(find "$RUNNER_TEMP/strict-guard-source" \
            -name build.sh -type f | head -n 1)

          if [ -z "$BUILD_SCRIPT" ]; then
            echo "build.sh not found in source.zip"
            exit 1
          fi

          echo "SOURCE_DIR=$(dirname "$BUILD_SCRIPT")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$SOURCE_DIR"
          chmod +x build.sh
          bash build.sh

      - name: Upload APK and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strict-Guard-Build
          path: |
            ${{ env.SOURCE_DIR }}/output/*.apk
            ${{ env.SOURCE_DIR }}/build-reports/**
          if-no-files-found: warn
          retention-days: 14
