
name: Build Strict Guard APK

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare build environment
        run: |
          mkdir -p "$HOME/workspace"
          mkdir -p "$HOME/workspace/.sdk-tmp"

          ln -s "$JAVA_HOME" "$HOME/workspace/jdk17"
          ln -s "$ANDROID_HOME" "$HOME/workspace/.android-sdk"

          cd "$HOME/workspace"

          curl -fL \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip \
            -o kotlin.zip

          unzip -q kotlin.zip -d kotlinc-1.9.22

          curl -fL \
            https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar \
            -o .sdk-tmp/junit-4.13.2.jar

          curl -fL \
            https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar \
            -o .sdk-tmp/hamcrest-core-1.3.jar

      - name: Detect and extract ZIP
        run: |
          mapfile -t ZIP_FILES < <(
            find . -maxdepth 2 -type f -iname '*.zip' \
              -not -path './.git/*'
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP found!"
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "ERROR: Multiple ZIP files found!"
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"
          echo "Detected: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/strict-guard-source"

          unzip -q "$ZIP_FILE" \
            -d "$RUNNER_TEMP/strict-guard-source"

          BUILD_SCRIPT=$(find \
            "$RUNNER_TEMP/strict-guard-source" \
            -type f -name build.sh | head -n 1)

          if [ -z "$BUILD_SCRIPT" ]; then
            echo "ERROR: build.sh not found!"
            exit 1
          fi

          echo "SOURCE_DIR=$(dirname "$BUILD_SCRIPT")" \
            >> "$GITHUB_ENV"

          echo "Build script: $BUILD_SCRIPT"

      - name: Build APK
        run: |
          set -o pipefail
          cd "$SOURCE_DIR"
          chmod +x build.sh
          bash build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Upload APK and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strict-Guard-Build
          path: |
            ${{ env.SOURCE_DIR }}/output/*.apk
            ${{ env.SOURCE_DIR }}/build-reports/**
            ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 14
