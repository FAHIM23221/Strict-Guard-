
name: Build Strict Guard APK

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find and configure Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "Searching for Android SDK..."

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK directory not found!"
            exit 1
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found!"
            find "$ANDROID_HOME" -maxdepth 5 -type f \
              -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"

          chmod +x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK configured successfully."

      # 4. Prepare Kotlin and build dependencies
      - name: Prepare build environment
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/workspace"
          mkdir -p "$HOME/workspace/.sdk-tmp"

          ln -s "$JAVA_HOME" "$HOME/workspace/jdk17"
          ln -s "$ANDROID_HOME" "$HOME/workspace/.android-sdk"

          cd "$HOME/workspace"

          echo "Downloading Kotlin compiler..."

          curl -fL --retry 3 \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip \
            -o kotlin.zip

          unzip -q kotlin.zip -d kotlinc-1.9.22

          test -x kotlinc-1.9.22/kotlinc/bin/kotlinc

          echo "Downloading JUnit..."

          curl -fL --retry 3 \
            https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar \
            -o .sdk-tmp/junit-4.13.2.jar

          curl -fL --retry 3 \
            https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar \
            -o .sdk-tmp/hamcrest-core-1.3.jar

          echo "Build dependencies ready."

      # 5. Detect any ZIP filename
      - name: Detect ZIP automatically
        shell: bash
        run: |
          set -e

          echo "Searching for source ZIP..."

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname '*.zip'
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "ERROR: Multiple ZIP files found."
            printf '%s\n' "${ZIP_FILES[@]}"
            echo "Keep only one source ZIP in repository root."
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"

          echo "Detected ZIP: $ZIP_FILE"

          echo "Checking ZIP integrity..."

          unzip -t "$ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/strict-guard-source"

          echo "Extracting ZIP..."

          unzip -q "$ZIP_FILE" \
            -d "$RUNNER_TEMP/strict-guard-source"

          echo "Extraction completed."

          echo "Searching for build.sh..."

          mapfile -t BUILD_SCRIPTS < <(
            find "$RUNNER_TEMP/strict-guard-source" \
              -type f -name build.sh
          )

          if [ "${#BUILD_SCRIPTS[@]}" -eq 0 ]; then
            echo "ERROR: build.sh not found!"
            exit 1
          fi

          BUILD_SCRIPT="${BUILD_SCRIPTS[0]}"
          SOURCE_DIR="$(dirname "$BUILD_SCRIPT")"

          echo "Build script: $BUILD_SCRIPT"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      # 6. Build APK
      - name: Build Strict Guard APK
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$SOURCE_DIR"

          chmod +x build.sh

          echo "Starting APK build..."

          bash build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"

          echo "Searching for generated APK..."

          find . -type f -name '*.apk' -print

          if ! find . -type f -name '*.apk' | grep -q .; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK build completed."

      # 7. Collect APK and logs
      - name: Collect build results
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/build-results"

          if [ -n "${SOURCE_DIR:-}" ] && [ -d "$SOURCE_DIR" ]; then
            find "$SOURCE_DIR" -type f \
              \( -name '*.apk' -o -path '*/build-reports/*' \) \
              -exec cp --parents {} "$RUNNER_TEMP/build-results/" \;
          fi

          if [ -f "$RUNNER_TEMP/build.log" ]; then
            cp "$RUNNER_TEMP/build.log" \
              "$RUNNER_TEMP/build-results/"
          fi

      # 8. Upload artifacts
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strict-Guard-Build
          path: ${{ runner.temp }}/build-results/
          if-no-files-found: warn
          retention-days: 14
